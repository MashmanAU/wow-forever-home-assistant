name: Build and publish app images

on:
  push:
    branches: [main]
    paths:
      - "wow_forever_level_bot/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read app version
        id: app
        shell: bash
        run: |
          version=$(awk -F'"' '/^version:/ {print $2; exit}' wow_forever_level_bot/config.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: wow_forever_level_bot
          file: wow_forever_level_bot/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          tags: |
            ghcr.io/mashmanau/${{ matrix.arch }}-wow-forever-level-bot:${{ steps.app.outputs.version }}
            ghcr.io/mashmanau/${{ matrix.arch }}-wow-forever-level-bot:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MashmanAU/wow-forever-home-assistant
            org.opencontainers.image.version=${{ steps.app.outputs.version }}

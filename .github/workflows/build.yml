name: Build and publish app images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wow_forever_level_bot/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' wow_forever_level_bot/config.yaml | head -1 | sed -E 's/version:[[:space:]]*["'"'"']?([^"'"'"']+)["'"'"']?$/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: wow_forever_level_bot
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/mashmanau/${{ matrix.arch }}-wow-forever-level-bot:${{ steps.version.outputs.version }}
            ghcr.io/mashmanau/${{ matrix.arch }}-wow-forever-level-bot:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MashmanAU/wow-forever-home-assistant
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

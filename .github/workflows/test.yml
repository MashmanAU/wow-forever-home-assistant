name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wow_forever_level_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wow_forever_level_bot/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Validate PowerShell publisher
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "publish.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "publish.ps1 syntax is valid."
      - name: Test publisher Git stderr handling
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          function Invoke-IntegrationTest {
            param([string[]]$Arguments)

            $previousErrorActionPreference = $ErrorActionPreference
            $hasNativeErrorPreference = $null -ne (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue)
            if ($hasNativeErrorPreference) {
              $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            }
            try {
              $ErrorActionPreference = "Continue"
              if ($hasNativeErrorPreference) {
                $PSNativeCommandUseErrorActionPreference = $false
              }
              $output = @(& pwsh -NoProfile -File ./tests/publish_integration.ps1 @Arguments 2>&1)
              $exitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousErrorActionPreference
              if ($hasNativeErrorPreference) {
                $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
              }
            }
            return [PSCustomObject]@{ ExitCode = $exitCode; Output = $output }
          }

          $success = Invoke-IntegrationTest -Arguments @()
          $success.Output | ForEach-Object { Write-Host "$_" }
          if ($success.ExitCode -ne 0) {
            throw "Publisher integration test failed with exit code $($success.ExitCode)."
          }

          $failure = Invoke-IntegrationTest -Arguments @("-ForceAssertionFailure")
          if ($failure.ExitCode -eq 0) {
            $failure.Output | ForEach-Object { Write-Host "$_" }
            throw "A forced integration-test assertion failure incorrectly exited 0."
          }
          if (($failure.Output -join "`n") -notmatch "Forced assertion failure for exit-code verification") {
            $failure.Output | ForEach-Object { Write-Host "$_" }
            throw "The forced assertion failure did not surface its original message."
          }

          Write-Host "Integration test success exits 0: PASS"
          Write-Host "Integration test assertion failure exits non-zero: PASS"
          exit 0

name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./wow_forever_level_bot[test]"
      - run: pytest -q
        working-directory: wow_forever_level_bot
      - run: python -m py_compile wow_forever_bot/*.py
        working-directory: wow_forever_level_bot

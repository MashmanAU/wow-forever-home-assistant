[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-level-bot"
version = "1.7.1"
description = "Discord level tracker for World of Warcraft Forever"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiohttp>=3.9,<4",
  "discord.py>=2.4,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["wow_forever_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

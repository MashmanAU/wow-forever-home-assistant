[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-level-bot"
version = "1.12.0"
description = "Discord level tracker for World of Warcraft Forever"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiohttp>=3.9,<4",
  "discord.py>=2.6,<3",
  "Pillow>=11,<13",
  "tzdata>=2025.2",
  "wcwidth>=0.2.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["wow_forever_bot*"]

[tool.setuptools.package-data]
wow_forever_bot = ["assets/class_icons/*.png", "assets/class_icons/*.md", "assets/class_icons/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: WoW Forever Level Bot
version: "1.10.0"
slug: wow_forever_level_bot
description: Discord bot with native, table, Components V2 and deterministic image leaderboards.
url: https://develop.battle.net/documentation/world-of-warcraft/profile-apis
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
image: ghcr.io/mashmanau/{arch}-wow-forever-level-bot
options:
  discord_token: ""
  blizzard_client_id: ""
  blizzard_client_secret: ""
  log_level: INFO
  schedule_check_seconds: 60
  default_timezone: Australia/Sydney
  openai_api_key: ""
  openai_model: gpt-4.1-mini
  commentary_enabled: true
  commentary_max_words: 70
  commentary_roast_level: mild
  announcer_style: "Cheeky Azeroth sports desk and radio announcer with dry humour, short sharp observations and light roasting. Sound like you are talking to a group of mates who play WoW together. Avoid motivational newsletter language."
  announcer_custom_notes: "Cold opens are encouraged. WoW references are welcome but do not force them. Occasional running jokes are fine. Do not finish every report with a catchphrase."
  commentary_news_emphasis: normal
  commentary_character_banter: normal
  wowhead_feed_url: https://www.wowhead.com/news/rss/all
  wowhead_lookback_hours: 24
  wowhead_keywords: wow forever,world of warcraft forever,forever realms,forever realm,forever hardcore
  test_channel_name: bot-stuff
  leaderboard_render_mode: minimal_image
  leaderboard_density: standard
  show_rank: false
  show_race: false
  show_class: false
  show_level: true
  show_level_progress: false
  show_lifetime_deaths: true
  show_professions: false
  show_24h_changes: true
  show_7d_changes: false
  show_notable_activity: false
  image_columns: two
  image_theme: dark_warcraft
  use_class_colours: true
  show_class_icons: true
  show_profession_icons: true
schema:
  discord_token: password
  blizzard_client_id: str
  blizzard_client_secret: password
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  schedule_check_seconds: int(15,3600)
  default_timezone: str
  openai_api_key: password
  openai_model: str
  commentary_enabled: bool
  commentary_max_words: int(40,160)
  commentary_roast_level: list(gentle|mild|spicy)
  announcer_style: str
  announcer_custom_notes: str
  commentary_news_emphasis: list(low|normal|high)
  commentary_character_banter: list(low|normal|high)
  wowhead_feed_url: str
  wowhead_lookback_hours: int(1,72)
  wowhead_keywords: str
  test_channel_name: str
  leaderboard_render_mode: list(minimal_image|split_image|table|native_embed|components_v2|image)
  leaderboard_density: list(compact|standard|detailed)
  show_rank: bool
  show_race: bool
  show_class: bool
  show_level: bool
  show_level_progress: bool
  show_lifetime_deaths: bool
  show_professions: bool
  show_24h_changes: bool
  show_7d_changes: bool
  show_notable_activity: bool
  image_columns: list(one|two)
  image_theme: list(dark_warcraft|parchment|minimal)
  use_class_colours: bool
  show_class_icons: bool
  show_profession_icons: bool
build_from:
  amd64: ghcr.io/home-assistant/amd64-base:3.21
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
